# Single-service deployment (2026-08-19): Django + Celery worker + Celery
# beat + Next.js frontend all run inside one Docker container (see
# ../Dockerfile, Procfile, docker/), fronted by nginx on one public port.
# Redis and Postgres remain Render's managed data services rather than
# being folded into the container — they're infrastructure, not
# application code, and merging a database or cache into an app container
# would trade away backups/persistence for no real benefit.
databases:
  - name: trend-intelligence-db
    databaseName: trend_intelligence
    plan: free

services:
  - type: web
    name: trend-intelligence
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: trend-intelligence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: trend-intelligence-redis
          property: connectionString
      # ALLOWED_HOSTS/CORS_ALLOWED_ORIGINS/CSRF_TRUSTED_ORIGINS: set these
      # to this service's own Render domain once it exists (frontend and
      # backend now share one origin via nginx, so these matter less than
      # they used to, but ALLOWED_HOSTS still has no code-level default
      # and Django will refuse to boot without it).
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_SCORING_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_CONTENT_MODEL
        value: gemini-3.1-flash-lite
      # Keep Gemini requests deliberate for the demo: Analyze now and
      # Generate content brief call Gemini, while incoming trends do not.
      - key: AI_AUTO_ANALYZE_NEW_TRENDS
        value: "False"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: redis
    name: trend-intelligence-redis
    plan: free
    ipAllowList: []
