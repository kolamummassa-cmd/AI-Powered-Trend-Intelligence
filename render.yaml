databases:
  - name: trend-intelligence-db
    databaseName: trend_intelligence
    plan: free

services:
  - type: web
    name: trend-intelligence-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements/prod.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_platforms && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: trend-intelligence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: trend-intelligence-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: claude
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: worker
    name: trend-intelligence-celery-worker
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements/prod.txt
    startCommand: celery -A config worker -l info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: trend-intelligence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: trend-intelligence-redis
          property: connectionString
      - key: AI_PROVIDER
        value: claude
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: worker
    name: trend-intelligence-celery-beat
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements/prod.txt
    startCommand: celery -A config beat -l info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: trend-intelligence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: trend-intelligence-redis
          property: connectionString

  - type: redis
    name: trend-intelligence-redis
    plan: free
    ipAllowList: []

  - type: web
    name: trend-intelligence-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
